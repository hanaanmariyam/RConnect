{% extends "base.html" %}{% block title %}Auditions{% endblock %}{% block content %}<h1>Auditions</h1><div class="row g-4">{% for a in auditions %}<div class="col-md-6 col-lg-4"><div class="card h-100"><div class="card-body"><span class="badge bg-success">{{ a.get_status_display }}</span><h5 class="mt-2">{{ a.title }}</h5><p>{{ a.club.name }} · {{ a.date }} · {{ a.venue }}</p><a class="btn btn-outline-success" href="{% url 'auditions:detail' a.pk %}">Details</a></div></div></div>{% empty %}<div class="empty">No auditions currently available.</div>{% endfor %}</div>{% endblock %}
