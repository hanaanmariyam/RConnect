{% extends "base.html" %}{% block title %}Auditions{% endblock %}{% block content %}<div class="d-flex justify-content-between"><h1>Auditions</h1><a class="btn btn-success" href="{% url 'auditions:create' %}">Create Audition</a></div><table class="table mt-3"><tr><th>Title</th><th>Date</th><th>Status</th></tr>{% for a in auditions %}<tr><td>{{ a.title }}</td><td>{{ a.date }}</td><td>{{ a.status }}</td></tr>{% empty %}<tr><td colspan="3">No auditions yet.</td></tr>{% endfor %}</table>{% endblock %}
