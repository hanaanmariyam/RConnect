{% extends "base.html" %}{% block title %}Members{% endblock %}{% block content %}<h1>{{ club.name }} Members</h1><div class="table-responsive"><table class="table"><tr><th>Name</th><th>Student ID</th><th>Status</th><th>Joined</th></tr>{% for m in members %}<tr><td>{{ m.student.full_name }}</td><td>{{ m.student.student_id }}</td><td>{{ m.status }}</td><td>{{ m.joined_date }}</td></tr>{% empty %}<tr><td colspan="4">No members yet.</td></tr>{% endfor %}</table></div>{% endblock %}
