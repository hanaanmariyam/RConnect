{% extends "base.html" %}{% block title %}Login{% endblock %}{% block content %}<div class="form-card mx-auto"><h2>Login</h2><p class="text-muted">Use your RConnect email and password.</p><form method="post">{% csrf_token %}<div class="mb-3"><label>Email</label><input name="email" type="email" class="form-control" required></div><div class="mb-3"><label>Password</label><input name="password" type="password" class="form-control" required></div><button class="btn btn-success w-100">Login</button></form><p class="mt-3">New student? <a href="{% url 'accounts:register' %}">Create an account</a>.</p></div>{% endblock %}
