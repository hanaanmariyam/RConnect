{% extends "base.html" %}{% block title %}Manage Events{% endblock %}{% block content %}<div class="d-flex justify-content-between"><h1>Events</h1><a class="btn btn-success" href="{% url 'events:create' %}">Create Event</a></div><div class="table-responsive mt-3"><table class="table"><tr><th>Event</th><th>Date</th><th>Status</th><th>Actions</th></tr>{% for e in events %}<tr><td>{{ e.event_name }}</td><td>{{ e.date }}</td><td>{{ e.get_status_display }}</td><td><a href="{% url 'events:edit' e.pk %}">Edit</a> <form class="d-inline" method="post" action="{% url 'events:delete' e.pk %}">{% csrf_token %}<button class="btn btn-link text-danger p-0">Delete</button></form></td></tr>{% empty %}<tr><td colspan="4">No events yet.</td></tr>{% endfor %}</table></div>{% endblock %}
